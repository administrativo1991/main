<section class="tela coluna" id="s-confirmar" hidden>
  <div class="titulo">
    <h1>Confirmações</h1>
    <span class="muted so-pc">escolha o dia das sessões; mensagem pronta no WhatsApp, uma por família</span>
  </div>
  <div class="filtros no-print">
    <div class="databox">
      <button type="button" class="btn icone p" id="cf-ant" aria-label="Dia anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button type="button" class="datatxt" id="cf-cal" title="Escolher a data das sessões"><span id="cf-titulo">Sessões de…</span></button>
      <button type="button" class="btn icone p" id="cf-prox" aria-label="Próximo dia"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <input type="date" id="cf-data" class="sr" aria-label="Data das sessões" tabindex="-1">
    <select id="cf-prof" aria-label="Profissional" class="auto"><option value="">Todos os profissionais</option></select>
    <div class="seg mini" id="cf-mostrar" role="group" aria-label="Mostrar"><button type="button" data-v="falta" aria-pressed="true">A confirmar</button><button type="button" data-v="todos" aria-pressed="false">Todos</button></div>
  </div>
  <div class="fd-resumo" id="cf-resumo" hidden></div>
  <div id="cf-carregando" class="carregando esqueleto"><div></div><div></div></div>
  <div class="cf-lista" id="cf-lista"></div>
  <div class="muted" id="cf-status"></div>
</section>
